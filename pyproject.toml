[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-options-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "alembic>=1.13,<2",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "protobuf>=7.35.1,<8",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "bandit>=1.7,<2", "pytest-cov>=5,<7", "types-protobuf>=7.35,<8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
exclude = ["apps.web*", "tests*", "work*", "build*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
