name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nifty_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d nifty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform:ci-local-only@localhost:5432/nifty_test
      TEST_POSTGRES_URL: postgresql+psycopg://platform:ci-local-only@localhost:5432/nifty_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      UPSTOX_ANALYTICS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --no-deps -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: ruff check apps packages alembic tests
      - run: mypy apps/api apps/paper_worker apps/forward_runner apps/nightly apps/supervisor packages
      - run: bandit -q -r apps/api apps/paper_worker apps/forward_runner apps/nightly apps/supervisor packages

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
