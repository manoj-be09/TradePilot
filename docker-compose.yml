services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nifty_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d nifty_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes:
      - feed-observations:/observations
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    # The source tree is bind-mounted so the container always runs this checkout.
    # Keep the container's Next cache separate from host builds. Invoke Next
    # directly so CLI flags reach Next rather than pnpm's script parser.
    command: sh -c "npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Docker Desktop's Windows bind mount may not forward file-change events.
      WATCHPACK_POLLING: "1000"
    healthcheck:
      # Fail visibly if the web process did not serve the current branded app.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | grep -q TradingPilot"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api: { condition: service_healthy }
  paper-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: python -m apps.paper_worker.main
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://api:8000/ready/paper-worker', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
  feed-observer:
    profiles: ["observations"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    command: python -m apps.feed_observer.main --instrument "NSE_EQ|INE002A01018"
    volumes:
      - feed-observations:/observations
    restart: unless-stopped
volumes:
  postgres-data:
  web-node-modules:
  web-next-cache:
  feed-observations:
